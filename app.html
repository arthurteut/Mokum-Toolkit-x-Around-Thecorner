<head>

<title>aroundthecorner.toolkit</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #50534A; color: #2C2E28;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; padding: 20px;
  }
  .gate {
    background: #F4F4F0; border-radius: 16px; padding: 36px 32px;
    width: 100%; max-width: 420px; box-shadow: 0 18px 48px rgba(0,0,0,0.3); text-align: center;
  }
  .gate img { height: 56px; width: auto; background: #50534A; border-radius: 14px; padding: 10px; }
  h1 { font-size: 20px; margin: 18px 0 6px; letter-spacing: 0.02em; }
  .sub { color: #6D7066; font-size: 14.5px; margin: 0 0 22px; line-height: 1.5; }
  input[type="password"] {
    width: 100%; font-size: 17px; padding: 13px 14px; border: 1.5px solid #D8DAD0;
    border-radius: 10px; background: #FFFFFF; color: #2C2E28;
  }
  input[type="password"]:focus { outline: 3px solid #C98500; outline-offset: 2px; }
  .remember {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 13.5px; color: #6D7066; margin: 14px 0 18px; cursor: pointer;
  }
  button {
    width: 100%; font-size: 16px; font-weight: 700; padding: 13px;
    background: #50534A; color: #FFFFFF; border: none; border-radius: 10px; cursor: pointer;
  }
  button:hover { background: #3E4139; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err { color: #A33B2E; font-size: 13.5px; min-height: 20px; margin-top: 12px; font-weight: 700; }
  .foot { margin-top: 20px; font-size: 12.5px; color: #6D7066; }
  .foot a { color: inherit; }
</style>
</head>

  var KEY_LS = "atc-app-key";

  function show(html) {
    var hash = location.hash;
    if (hash) {
      html += '<script>window.addEventListener("load",function(){setTimeout(function(){var el=document.getElementById(' +
        JSON.stringify(hash.slice(1)) + ');if(el)el.scrollIntoView();},250);});<\/script>';
    }
    document.open();
    document.write(html);
    document.close();
  }

  function decryptWith(rawKey) {
    return crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: IV }, key, DATA);
    }).then(function (plain) {
      return { raw: rawKey, html: new TextDecoder().decode(plain) };
    });
  }

  function derive(pwd) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveBits"])
      .then(function (km) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", salt: SALT, iterations: 300000, hash: "SHA-256" }, km, 256);
      });
  }

  // auto-unlock dacă dispozitivul e ținut minte
  try {
    var saved = localStorage.getItem(KEY_LS);
    if (saved) {
      decryptWith(b64(saved).buffer).then(function (r) { show(r.html); })
        .catch(function () { try { localStorage.removeItem(KEY_LS); } catch (e) {} });
    }
  } catch (e) { /* stocare indisponibilă */ }

  document.getElementById("gate").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("go"), err = document.getElementById("err");
    btn.disabled = true; err.textContent = "";

      return decryptWith(raw);
    }).then(function (r) {

        try {
          var arr = new Uint8Array(r.raw), s = "";
          for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
          localStorage.setItem(KEY_LS, btoa(s));
        } catch (e2) { /* fără memorie */ }
      }
      show(r.html);
    }).catch(function () {
      btn.disabled = false;
      err.textContent = "Parolă greșită — mai încearcă.";
    });
  });
})();
</script>
