<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Around The Corner</title>
<meta name="description" content="Around The Corner: we create third spaces that people want to be part of.">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="../plugins/atc-motion/assets/vendor/lenis.css">
<link rel="stylesheet" href="../plugins/atc-motion/assets/atc-motion.css">
<script>
  window.ATC_MOTION_CONFIG = { smooth: true, progress: false, cursor: true, preloader: false, transitions: true, markers: false };
  (function (d) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var h = d.documentElement; h.classList.add('atc-js');
    try { if (sessionStorage.getItem('atcPT')) h.classList.add('atc-pt-in', 'atc-no-preload'); } catch (e) {}
    window.__atcFailsafe = setTimeout(function () { h.classList.remove('atc-js'); }, 4000);
  })(document);
</script>
<style>
  /* Pagina 1 (/): designul actual al site-ului (fotografia în trei coloane, benzile întunecate,
     titlul alb cu umbră), animat cu ATC Motion. */
  :root {
    --ink: #25332c;
    --sage: #44554d;
    --cream: #f8f7f0;
    --gold: #ebbb4d;
    --band: rgba(28, 30, 28, .55);
    --font: "Avenir Next LT Pro", "Avenir Next", "Avenir", "Nunito Sans", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: #fff; font: 400 17px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  .intro { position: relative; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto auto; }
  .intro .atc-bg-layer { object-position: 50% 50%; }
  .intro::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0) 30%, rgba(0,0,0,.28)); }
  .band, .intro__copy { position: relative; z-index: 2; }

  .band { background: var(--band); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); transform-origin: 0 50%; }
  .band--top { margin-top: calc(env(safe-area-inset-top, 0px) + 54px); padding: 22px clamp(16px, 6.7vw, 96px); }
  .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 50px; height: 50px; }
  .brand span { font-weight: 900; text-transform: uppercase; line-height: .9; font-size: 1.45rem; letter-spacing: .01em; }
  .brand small { display: block; font-size: .68em; }

  .intro__copy { align-self: center; padding: 48px clamp(16px, 8.6vw, 124px) 36px; }
  .intro__title {
    margin: 0; font-weight: 900; font-size: clamp(2.6rem, 5.2vw, 4.7rem); line-height: 1.12; letter-spacing: -.005em;
    text-shadow: 5px 2px 1px rgba(0, 0, 0, .52); max-width: 18ch; text-wrap: balance;
  }
  .intro__title em { font-style: normal; }

  .band--cta { justify-self: start; max-width: 100%; padding: 26px clamp(28px, 4vw, 64px) 30px clamp(16px, 8.6vw, 124px); margin-bottom: clamp(36px, 8vh, 96px); box-sizing: border-box; }
  .cta { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; white-space: nowrap; font-weight: 900; font-size: clamp(1.6rem, 2.6vw, 2.5rem); text-shadow: 3px 2px 1px rgba(0,0,0,.45); }
  .cta .arrow { display: inline-block; animation: nudge 2.4s cubic-bezier(.6,0,.2,1) 3s infinite; }
  .cta:hover { color: var(--gold); }
  @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 30% { transform: translateX(10px); } }

  /* zona cu abur peste ceștile din coloana dreaptă */
  .steam { position: absolute; z-index: 1; right: 0; top: 0; width: 33.4%; height: 100%; pointer-events: none; }

  .proto-note { position: fixed; z-index: 60; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); background: var(--gold); color: var(--ink); font: 700 .74rem/1.3 var(--font); padding: 8px 12px; border-radius: 999px; letter-spacing: .04em; text-decoration: none; }

  @media (max-width: 760px) {
    .intro .atc-bg-layer { object-position: 50% 50%; }
    .band--top { margin-top: calc(env(safe-area-inset-top, 0px) + 24px); padding-block: 16px; }
    .brand img { width: 42px; height: 42px; }
    .brand span { font-size: 1.15rem; }
    .steam { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <section class="intro atc-curtain atc-bg-zoom atc-bg-zoom--drift" data-atc-strips="3" data-atc-from="1.18" aria-label="Around The Corner">
    <img class="atc-bg-layer" src="img/intro.jpg" alt="">
    <div class="steam atc-steam" data-atc-steam-x="0.42" data-atc-steam-y="0.58" aria-hidden="true"></div>

    <div class="band band--top atc-reveal atc-reveal--left atc-delay-6">
      <a class="brand" href="index.html" aria-label="Around The Corner, acasă">
        <img src="img/atc-mark-white.png" alt="" width="50" height="50">
        <span>Around<small>The Corner</small></span>
      </a>
    </div>

    <div class="intro__copy">
      <h1 class="intro__title atc-split atc-split--words atc-split--instant atc-delay-7">We create third spaces that people want to be part&nbsp;of.</h1>
    </div>

    <div class="band band--cta atc-reveal atc-reveal--left atc-delay-8">
      <span class="atc-magnetic" style="display:inline-block"><a class="cta" href="acasa.html">Find out more <span class="arrow" aria-hidden="true">→</span></a></span>
    </div>
  </section>
</main>

<a class="proto-note" href="sectiuni.html">Prototip · vezi și paginile noi</a>

<script src="../plugins/atc-motion/assets/atc-motion.js"></script>
</body>
</html>
